[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-game"
version = "2.0.0"
description = "A modular Snake Game developed as a Software Engineering project at PES University."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Thejaswi S", email = "thejubhat2006@gmail.com" },
    { name = "Vishnu Maddirala" },
    { name = "V S Shashidharan" },
    { name = "Vishwas Hosamath" },
]
dependencies = [
    "pygame>=2.5",
    "bcrypt>=4.0",
    "Flask>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "build>=1.0",
]

[project.scripts]
snake-game = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["admin*", "app*", "auth*", "benchmarks*", "db*", "engine*", "modes*", "scoring*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
